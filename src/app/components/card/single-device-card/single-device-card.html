<mat-card>
  <mat-card-header>
    <mat-card-title>{{ title() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @for (item of items(); track $index) {
      @switch (item.type) {
        @case (TypeEntities.sensor) {
          <app-sensor [layout]="layout()" [sensor]="item"></app-sensor>
        }
        @case (TypeEntities.device) {
          <app-device [typeCard]="layout()" [cardId]="id()" [item]="item"></app-device>
        }
      }
    }
  </mat-card-content>
</mat-card>
