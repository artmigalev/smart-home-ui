<div class="{{ containerClass }}">
  @switch (layout()) {
    @case (Layout.verticalLayout) {
      <mat-icon>{{ icon }}</mat-icon>
      <span>{{ label }}</span>
      <div>
        <span>{{ value | valueConvertToString }}</span>
      </div>
    }
    @case (Layout.horizontalLayout) {
      <span>{{ label }}</span>
      <mat-icon>{{ icon }}</mat-icon>
      <div class="{{ layout() }}">
        <span>{{ value | valueConvertToString }}</span>
      </div>
    }
    @case (Layout.singleDevice) {
      <mat-icon>{{ icon }}</mat-icon>
      <span>{{ label }}</span>
      <div class="{{ layout() }}">
        <span>{{ value | valueConvertToString }}</span>
      </div>
    }
  }
</div>
